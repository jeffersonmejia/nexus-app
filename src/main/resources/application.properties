spring.application.name=nexus
server.port=8082
server.address=0.0.0.0
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexus}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nexus_local_only}
spring.datasource.hikari.connection-timeout=30000
